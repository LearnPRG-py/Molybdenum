name: tests_py3.10

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deps.txt

      - name: Tests
        run: |
          python3 tests.py

      - name: formatting
        run: |
          black --check --line-length 80 main.py 
